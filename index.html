<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐰 Coelhinho das Artes - Jogo Educativo</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">

    <!-- TELA DE ABERTURA -->
    <div id="telaAbertura" class="tela ativa">
      <div class="nuvem nuvem1">☁️</div>
      <div class="nuvem nuvem2">☁️</div>
      <div class="nuvem nuvem3">☁️</div>

      <div class="coelho-abertura">
        <div class="coelho-emoji">🐰</div>
      </div>

      <h1 class="titulo-abertura">Coelhinho das Artes 🎨</h1>
      <p class="subtitulo-abertura">Ajude o coelhinho a subir a escada<br>respondendo perguntas sobre <strong>Arte</strong>!</p>

      <div class="categorias">
        <span class="cat cat-musica">🎵 Música</span>
        <span class="cat cat-danca">💃 Dança</span>
        <span class="cat cat-teatro">🎭 Teatro</span>
        <span class="cat cat-visual">🖼️ Artes Visuais</span>
      </div>

      <button id="btnIniciar" class="btn-iniciar">🌸 INICIAR 🌸</button>
      <p class="dica">10 perguntas • 1 coelho fofo • Muita arte!</p>
    </div>

    <!-- TELA DO JOGO -->
    <div id="telaJogo" class="tela">
      <header class="header-jogo">
        <div class="info-rodada">
          <span class="badge">Pergunta <span id="numPergunta">1</span>/10</span>
          <span class="badge badge-acertos">⭐ <span id="acertos">0</span></span>
        </div>
        <button id="btnReiniciar" class="btn-reiniciar">🔄</button>
      </header>

      <!-- CENÁRIO DA ESCADA -->
      <div class="cenario">
        <div class="ceu"></div>
        <div class="sol">☀️</div>

        <div class="escada" id="escada">
          <!-- Degraus gerados via JS -->
        </div>

        <div class="coelho-container" id="coelhoContainer">
          <div class="coelho" id="coelho">
            <div class="balao-fala" id="balaoFala"></div>
            <div class="coelho-corpo">
              <div class="orelha orelha-e"></div>
              <div class="orelha orelha-d"></div>
              <div class="cabeca">
                <div class="olho olho-e"></div>
                <div class="olho olho-d"></div>
                <div class="nariz"></div>
                <div class="bochecha bochecha-e"></div>
                <div class="bochecha bochecha-d"></div>
                <div class="bigode bigode-e"></div>
                <div class="bigode bigode-d"></div>
              </div>
            </div>
            <div class="cenoura" id="cenoura">🥕</div>
          </div>
        </div>

        <div class="grama"></div>
      </div>

      <!-- PAINEL DA PERGUNTA -->
      <div class="painel-pergunta">
        <div class="categoria-pergunta" id="categoriaPergunta">🎵 Música</div>
        <h2 class="pergunta" id="pergunta">Carregando...</h2>
        <div class="alternativas" id="alternativas"></div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>

    <!-- TELA FINAL -->
    <div id="telaFinal" class="tela">
      <div class="resultado-card">
        <div class="emoji-final" id="emojiFinal">🏆</div>
        <h1 id="tituloFinal">Parabéns!</h1>
        <p id="mensagemFinal"></p>
        <div class="pontuacao-final">
          <span class="acertos-final" id="acertosFinal">0</span>
          <span class="de">/ 10</span>
        </div>
        <button id="btnJogarNovamente" class="btn-iniciar">🌈 JOGAR NOVAMENTE</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
