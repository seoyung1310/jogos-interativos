<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐰 Coelho das Artes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">

    <!-- ===== TELA INICIAL ===== -->
    <section id="telaInicial" class="tela ativa">
      <div class="emoji-grande">🐇🌸</div>
      <h1>Coelho das Artes</h1>
      <p class="subtitulo">
        Ajude o coelhinho a subir a escada respondendo perguntas
        sobre <strong>música</strong>, <strong>dança</strong>,
        <strong>teatro</strong> e <strong>artes visuais</strong>!
      </p>
      <button id="btnIniciar" class="btn-principal">✨ INICIAR ✨</button>
      <p class="rodape">🎨 10 perguntas • 6º ano • Arte</p>
    </section>

    <!-- ===== TELA DO JOGO ===== -->
    <section id="telaJogo" class="tela">
      <header class="cabecalho">
        <span id="infoPergunta">Pergunta 1 de 10</span>
        <span>🐰 Acertos: <strong id="infoAcertos">0</strong></span>
      </header>

      <div class="cenario">
        <div id="escada" class="escada"></div>
      </div>

      <div class="caixa-pergunta">
        <p id="textoPergunta" class="texto-pergunta">Carregando...</p>
        <div id="alternativas" class="alternativas"></div>
      </div>

      <div class="rodape-jogo">
        <p id="mensagem" class="mensagem"></p>
        <button id="btnProxima" class="btn-proxima">Próxima ➡️</button>
      </div>
    </section>

    <!-- ===== TELA FINAL ===== -->
    <section id="telaFinal" class="tela">
      <div id="emojiFinal" class="emoji-grande">🐇✨</div>
      <h2 id="tituloFinal">Parabéns!</h2>
      <p id="placarFinal" class="subtitulo"></p>
      <button id="btnReiniciar" class="btn-principal">🔄 Jogar de novo</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
