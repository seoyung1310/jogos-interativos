<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐰 Coelho das Artes - Jogo Educativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container" id="gameContainer">

    <!-- TELA DE ABERTURA -->
    <div class="start-screen" id="startScreen">
      <div class="bunny-hello">🐇🌸</div>
      <h1>Coelho das Artes</h1>
      <p class="start-text">
        Ajude o coelhinho a subir a escada acertando perguntas sobre
        música, dança, teatro e artes visuais!
      </p>
      <button class="start-btn" id="startBtn">✨ INICIAR ✨</button>
      <div class="credits">🎨 10 perguntas • 6º ano • Arte</div>
    </div>

    <!-- TELA DO JOGO -->
    <div class="game-area" id="gameArea">
      <div class="game-header">
        <div class="round-info" id="roundInfo">Pergunta 1 / 10</div>
        <div>🐰 Acertos: <span id="scoreDisplay">0</span></div>
      </div>

      <div class="scene">
        <div class="ladder-area" id="ladderArea">
          <div class="bunny-wrapper" id="bunnyWrapper">
            <div class="bunny-emoji" id="bunnyEmoji">🐇</div>
            <div class="carrot-throw" id="carrotThrow">🥕</div>
          </div>
        </div>
      </div>

      <div class="question-box">
        <div class="question-text" id="questionText">Carregando...</div>
        <div class="options-grid" id="optionsGrid"></div>
      </div>

      <div class="feedback-area">
        <div class="message" id="feedbackMessage"></div>
        <button class="next-btn" id="nextBtn">Próxima ➡️</button>
      </div>
    </div>

    <!-- TELA DE FIM -->
    <div class="end-screen" id="endScreen">
      <div class="end-bunny" id="endBunny">🐇✨</div>
      <h2 id="endTitle">Você conseguiu!</h2>
      <p class="end-score-text" id="endScore"></p>
      <button class="play-again-btn" id="playAgainBtn">Jogar de novo 🌱</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
