 <!DOCTYPE html>
 <html lang="pt-BR">
 <head>
   <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Verdade ou Desafio - Artes</title>
         <link rel="stylesheet" href="style.css">
         </head>
         <body>
           <main class="container">
               <div class="coelho">🐰</div>

                   <section id="inicio" class="tela ativa">
                         <h1>Verdade ou Desafio</h1>
                               <p>Jogo de Artes para o 6º ano</p>
                                     <p class="descricao">Responda perguntas sobre cores, música e teatro!</p>
                                           <button id="btnIniciar">Iniciar jogo</button>
                                               </section>

                                                   <section id="jogo" class="tela">
                                                         <div class="topo">
                                                                 <span id="rodada">Rodada 1</span>
                                                                         <span id="pontuacao">Pontos: 0</span>
                                                                               </div>

                                                                                     <h2 id="pergunta">Escolha uma opção</h2>

                                                                                           <div class="opcoes">
                                                                                                   <button id="btnVerdade">Verdade</button>
                                                                                                           <button id="btnDesafio">Desafio</button>
                                                                                                                 </div>

                                                                                                                       <div id="cartao" class="cartao">
                                                                                                                               <p id="textoCartao">Escolha Verdade ou Desafio para começar.</p>
                                                                                                                                       <div id="respostas"></div>
                                                                                                                                             </div>

                                                                                                                                                   <button id="btnProxima" class="oculto">Próxima rodada</button>
                                                                                                                                                       </section>

                                                                                                                                                           <section id="final" class="tela">
                                                                                                                                                                 <h2>Parabéns! 🎉</h2>
                                                                                                                                                                       <p id="resultado"></p>
                                                                                                                                                                             <button id="btnReiniciar">Jogar novamente</button>
                                                                                                                                                                                 </section>
                                                                                                                                                                                   </main>

                                                                                                                                                                                     <script src="main.js"></script>
                                                                                                                                                                                     </body>
                                                                                                                                                                                     </html>
