<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 Jogo das Artes - Enforcado Fofo 🎭</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-container">

    <!-- TELA DE ABERTURA -->
    <div id="start-screen" class="screen active">
      <h1 class="titulo">🎨 Jogo das Artes 🎭</h1>
      <p class="subtitulo">Música • Dança • Teatro • Artes Visuais</p>

      <div class="boneco-abertura">🐰</div>

      <p class="instrucoes">
        Responda 10 perguntas sobre Arte.<br>
        Se errar, o coelhinho fica triste! 😢
      </p>

      <button id="btn-iniciar" class="btn-fofo">✨ Começar a Jogar ✨</button>
    </div>

    <!-- TELA DO JOGO -->
    <div id="game-screen" class="screen">
      <div class="top-bar">
        <div class="info">Rodada: <span id="current-round">1</span>/10</div>
        <div class="info">Acertos: <span id="score">0</span></div>
      </div>

      <div class="coelho-area">
        <div id="coelho" class="coelho">🐇</div>
      </div>

      <div class="pergunta-box">
        <p id="pergunta-texto">Carregando pergunta...</p>
      </div>

      <div id="alternativas-container" class="alternativas"></div>

      <div id="feedback" class="feedback"></div>
    </div>

    <!-- TELA FINAL -->
    <div id="end-screen" class="screen">
      <h2 id="end-title">Fim de Jogo!</h2>
      <p class="resultado-texto">Você acertou <span id="final-score">0</span> de 10 perguntas.</p>
      <div id="final-message" class="final-message"></div>
      <button id="btn-reiniciar" class="btn-fofo">🔄 Jogar Novamente</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
